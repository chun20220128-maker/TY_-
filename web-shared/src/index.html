<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>鑽探工作台｜公司網頁版</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#233348;font:16px system-ui,"Microsoft JhengHei",sans-serif}.card{max-width:580px;margin:15vh auto;padding:38px;background:white;border:1px solid #e3e8ef;border-radius:12px;line-height:1.9}h1{font-size:27px}p{color:#64748b}button{padding:11px 20px;background:#2861dc;color:white;border:0;border-radius:7px;cursor:pointer}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f5f8}</style><div class="card" id="accessCard"><h1>鑽探工作台</h1><p id="accessStatus">請使用管理者提供的完整專用連結開啟。</p><button id="retry" hidden>重新連線</button></div><script>
addEventListener('hashchange',()=>location.reload());
const token=new URLSearchParams(location.hash.slice(1)).get('access');window.workbenchAccessToken=token;
async function openWorkbench(){const status=document.getElementById('accessStatus'),retry=document.getElementById('retry');if(!/^[A-Za-z0-9_-]{43}$/.test(token||''))return;status.textContent='正在開啟工作台…';retry.hidden=true;try{const response=await fetch('./api/app',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!response.ok){const result=await response.json();throw Error(result.error||'暫時無法開啟，請稍後再試。')}const html=await response.text();const frame=document.createElement('iframe');frame.id='workbench';frame.title='鑽探工作台';frame.sandbox='allow-scripts allow-same-origin allow-downloads allow-modals';frame.srcdoc=html;document.body.appendChild(frame);document.getElementById('accessCard').hidden=true}catch(error){status.textContent=error.message;retry.hidden=false}}document.getElementById('retry').onclick=openWorkbench;openWorkbench();
</script></html>
