<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>鑽探工作台｜登入</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#233348;font:16px system-ui,"Microsoft JhengHei",sans-serif}.card{max-width:440px;margin:12vh auto;padding:36px;background:white;border:1px solid #e3e8ef;border-radius:12px;line-height:1.8}h1{font-size:27px;margin-top:0}p{color:#64748b}label{display:block;margin:14px 0}input{display:block;width:100%;margin-top:5px;padding:12px;font:inherit;border:1px solid #cbd5e1;border-radius:6px}button{width:100%;padding:12px;background:#2861dc;color:white;border:0;border-radius:7px;font:inherit;cursor:pointer}button:disabled{opacity:.6}#accessStatus{min-height:28px;font-size:14px}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f5f8}</style><div class="card" id="accessCard"><h1>鑽探工作台</h1><p>請使用公司提供的帳號與密碼登入。</p><form id="loginForm"><label>帳號<input id="username" name="username" autocomplete="username" required maxlength="200"></label><label>密碼<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1000"></label><button id="loginButton">登入</button></form><p id="accessStatus" role="status"></p></div><script>
// Credentials stay in the form/request only; session cookie is HttpOnly.
function clearOldLink(){if(location.hash)history.replaceState(null,'',location.pathname+location.search)}clearOldLink();addEventListener('hashchange',clearOldLink);
const status=document.getElementById('accessStatus'),button=document.getElementById('loginButton');
async function openWorkbench(){const response=await fetch('/api/app',{credentials:'same-origin',cache:'no-store'});if(response.status===401)return false;if(!response.ok){const data=await response.json();throw Error(data.error||'暫時無法連線。')}const frame=document.createElement('iframe');frame.id='workbench';frame.title='鑽探工作台';frame.sandbox='allow-scripts allow-same-origin allow-downloads allow-modals';frame.srcdoc=await response.text();document.body.appendChild(frame);document.getElementById('accessCard').hidden=true;document.getElementById('password').value='';return true}
document.getElementById('loginForm').onsubmit=async event=>{event.preventDefault();button.disabled=true;status.textContent='正在登入…';try{const response=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const result=await response.json();if(!response.ok)throw Error(result.error||'登入失敗');if(!await openWorkbench())throw Error('登入狀態未建立，請允許本站 Cookie 後重試。');status.textContent=''}catch(e){status.textContent=e.message}finally{button.disabled=false}};
openWorkbench().catch(e=>status.textContent=e.message);
</script></html>
